name: Samsarix Agent Readiness Check
description: Validate Samsarix, A2A, or MCP registry metadata and fail when selected deployment candidates are not ready.
author: Samsarix LLC

inputs:
  registry:
    description: Path to a Samsarix registry, A2A Agent Card, or MCP server.json in the caller workspace.
    required: true
  lifecycle:
    description: Comma-separated lifecycles to gate, or all.
    required: false
    default: review,production
  require-candidates:
    description: Fail when no records match the selected lifecycles.
    required: false
    default: "true"
  now:
    description: Optional YYYY-MM-DD or UTC timestamp for reproducible stale-evidence evaluation.
    required: false
    default: ""

runs:
  using: node24
  main: bin/samsarix-action.mjs

branding:
  icon: shield
  color: green
