{
  "name": "Registry workflow feedback",
  "description": "Report a reproducible problem or a real inventory-review need without sharing private metadata.",
  "title": "[Registry feedback]: ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This is a PUBLIC GitHub issue, not local browser storage. Use only bundled examples or a fictional reproduction. Do not paste inventories, review packets, private URLs, organization/agent names, credentials, prompts, traces, logs, or personal data. For vulnerabilities or sensitive reports, follow [SECURITY.md](https://github.com/Deathcharge/Helix-Unified-Hub/blob/main/SECURITY.md) and email support@samsarix.com without active secrets. Do not publish exploit details here."
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Public-report safety",
        "options": [
          {
            "label": "This report contains only fictional or public, non-sensitive information and is not an unpatched security disclosure.",
            "required": true
          }
        ]
      }
    },
    {
      "type": "dropdown",
      "id": "kind",
      "attributes": {
        "label": "Feedback type",
        "options": ["Incorrect or blocked behavior", "Usability or documentation problem", "Useful workflow or unmet need"]
      },
      "validations": { "required": true }
    },
    {
      "type": "dropdown",
      "id": "surface",
      "attributes": {
        "label": "Product surface",
        "options": ["Browser workspace", "CLI archive or source CLI", "GitHub Action", "Documentation or directory"]
      },
      "validations": { "required": true }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Version and environment",
        "description": "Release or commit, browser or Node version, and operating system. Exclude account names, local paths, and device identifiers.",
        "placeholder": "v1.3.0-rc.2; Node 24; Windows, or main commit; Firefox version; Linux"
      },
      "validations": { "required": true }
    },
    {
      "type": "dropdown",
      "id": "evidence",
      "attributes": {
        "label": "Basis of this report",
        "options": ["Tried bundled fictional examples", "Synthetic reproduction of a real workflow", "Proposal not yet tried"]
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "job",
      "attributes": {
        "label": "Job you need to complete",
        "description": "Describe the decision or review outcome in generic terms. What do you use today? Do not identify your company, agents, endpoints, or customers.",
        "render": "text"
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "observation",
      "attributes": {
        "label": "Steps and observed result",
        "description": "Name a bundled fixture, list steps or commands, then describe what happened. For a proposal, state that it was not tried. No pasted files, logs, or exported review packets.",
        "render": "text"
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "outcome",
      "attributes": {
        "label": "Expected outcome and impact",
        "description": "What should have happened? Does this block evaluation, repeat use, or a particular decision? If it helped, explain the useful outcome rather than endorsing its safety.",
        "render": "text"
      },
      "validations": { "required": true }
    },
    {
      "type": "dropdown",
      "id": "frequency",
      "attributes": {
        "label": "How often would this job occur?",
        "options": ["One-off evaluation", "Occasional review", "Monthly", "Weekly or more", "Not known yet"]
      },
      "validations": { "required": false }
    }
  ]
}
